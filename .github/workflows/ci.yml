name: PARIDHAN CI / CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Typecheck & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-Check Workspaces
        run: |
          pnpm --filter @paridhan/types type-check || true
          pnpm --filter @paridhan/validation type-check || true
          pnpm --filter @paridhan/api type-check

      - name: Run Backend API Test Suites (Phases 0-11 & E2E)
        run: pnpm --filter @paridhan/api test

      - name: Build Production Bundles
        run: |
          pnpm --filter @paridhan/api build
          pnpm --filter @paridhan/web build
